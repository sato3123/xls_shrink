name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # タグ push 時にリリースを作成する
  actions: read     # SignPath が成果物を取得する

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (.NET Framework 4.x csc)
        shell: cmd
        run: |
          set CSC=%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe
          if not exist bin mkdir bin
          "%CSC%" /nologo /utf8output /codepage:65001 /target:winexe /platform:anycpu /optimize+ /out:bin\XlsImageShrink.exe /r:System.dll /r:System.Core.dll /r:Microsoft.CSharp.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Xml.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /r:System.Web.Extensions.dll /r:Microsoft.VisualBasic.dll src\*.cs

      - name: Test (no Excel)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "citest"
          $p = Start-Process -FilePath "bin\XlsImageShrink.exe" -ArgumentList "--citest", "`"$dir`"" -Wait -PassThru
          $report = Join-Path $dir "citest_report.txt"
          if (Test-Path $report) {
            Get-Content $report -Encoding UTF8
            New-Item -ItemType Directory -Force test | Out-Null
            Copy-Item $report test\citest_report.txt
            $fails = Select-String -Path $report -Pattern "^(FAIL|FATAL)" -Encoding UTF8
            foreach ($f in $fails) { Write-Output "::error::$($f.Line)" }
          } else {
            Write-Output "::error::citest_report.txt was not created"
          }
          Write-Output "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citest-report
          path: test/citest_report.txt

      # SignPath に渡す未署名の exe（署名対象はこの 1 ファイルだけ）
      - name: Upload unsigned exe
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: XlsImageShrink-unsigned
          path: bin/XlsImageShrink.exe

      # SignPath Foundation の審査に通り、リポジトリの Variables / Secrets を設定すると有効になる
      #   Variables: SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG
      #   Secrets:   SIGNPATH_API_TOKEN
      - name: Sign with SignPath
        id: sign
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name != 'pull_request' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Check signature
        if: ${{ steps.sign.outcome == 'success' }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem signed -Recurse -Filter XlsImageShrink.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Output "Status: $($sig.Status)  Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Output "::error::signature is not valid"; exit 1 }
          Copy-Item $exe.FullName bin\XlsImageShrink.exe -Force

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: XlsImageShrink
          path: bin/XlsImageShrink.exe

      - name: Create release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $signed = "${{ steps.sign.outcome }}" -eq "success"
          $note = if ($signed) { "コード署名済み（SignPath Foundation）" } else { "コード署名なし。Windows 11 のスマート アプリ コントロールが有効な PC では起動がブロックされます。" }
          Compress-Archive -Path bin\XlsImageShrink.exe, README.md, LICENSE -DestinationPath "XlsImageShrink-$tag.zip"
          gh release create $tag bin\XlsImageShrink.exe "XlsImageShrink-$tag.zip" --title "XlsImageShrink $tag" --notes "$note`n`nExcel を使わないテストの結果は Actions の citest-report を参照してください。"
