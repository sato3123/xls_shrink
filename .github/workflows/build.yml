name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # リリースを作成する

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (.NET Framework 4.x csc)
        shell: cmd
        run: |
          set CSC=%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe
          if not exist bin mkdir bin
          "%CSC%" /nologo /utf8output /codepage:65001 /target:winexe /platform:anycpu /optimize+ /out:bin\XlsImageShrink.exe /r:System.dll /r:System.Core.dll /r:Microsoft.CSharp.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Xml.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /r:System.Web.Extensions.dll /r:Microsoft.VisualBasic.dll src\*.cs

      - name: Test (no Excel)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "citest"
          $p = Start-Process -FilePath "bin\XlsImageShrink.exe" -ArgumentList "--citest", "`"$dir`"" -Wait -PassThru
          $report = Join-Path $dir "citest_report.txt"
          if (Test-Path $report) {
            Get-Content $report -Encoding UTF8
            New-Item -ItemType Directory -Force test | Out-Null
            Copy-Item $report test\citest_report.txt
            $fails = Select-String -Path $report -Pattern "^(FAIL|FATAL)" -Encoding UTF8
            foreach ($f in $fails) { Write-Output "::error::$($f.Line)" }
          } else {
            Write-Output "::error::citest_report.txt was not created"
          }
          Write-Output "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citest-report
          path: test/citest_report.txt

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: XlsImageShrink
          path: bin/XlsImageShrink.exe

      # main への push で、AssemblyInfo のバージョンのリリースがまだなければ作成する
      - name: Create release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $m = Select-String -Path src\AssemblyInfo.cs -Pattern 'AssemblyInformationalVersion\("([^"]+)"\)'
          $tag = "v" + $m.Matches[0].Groups[1].Value
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output "$tag は作成済み"; exit 0 }
          $note = "コード署名なし。Windows 11 のスマート アプリ コントロールが有効な PC では起動がブロックされます。"
          Compress-Archive -Path bin\XlsImageShrink.exe, README.md, LICENSE -DestinationPath "XlsImageShrink-$tag.zip"
          gh release create $tag bin\XlsImageShrink.exe "XlsImageShrink-$tag.zip" --target "${{ github.sha }}" --title "XlsImageShrink $tag" --notes "$note`n`nExcel を使わないテストの結果は Actions の citest-report を参照してください。"
